name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Linux / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run studio:build
      - run: npm run studio:test
      - run: npm run setup:browser-tests -- --with-deps
      - run: npm run studio:e2e
        env:
          STUDIO_E2E_ALSA: '0'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: |
            studio/test-results/
            studio/playwright-report/
          retention-days: 7
